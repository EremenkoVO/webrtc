# /etc/nginx/conf.d/default.conf (внутри контейнера фронта)

# Сбросим логгирование для уменьшения шума
error_log /dev/stderr warn;
access_log /dev/stdout combined;

# Основной сервер
server {
    listen 80;
    server_name localhost;

    # Корень — папка с собранным Vue-приложением
    root /usr/share/nginx/html;
    index index.html;

    # Обработка маршрутов Vue Router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Отдача статики (js, css, images и т.д.) напрямую
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Запрет прямого доступа к файлам сборки
    location ~ /\. {
        deny all;
        return 404;
    }
}