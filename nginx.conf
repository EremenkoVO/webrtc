// Сгенерируй nginx конфиг для проксирования запросов на backend сервер
// Backend сервер слушает на порту 3000
// Прокси должен работать на порту 8080
server {
    listen 8080;

    location / {
        proxy_pass http://localhost:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Дополнительно, настроим обработку ошибок
error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
}
# Логи
access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log;
# Максимальный размер тела запроса
client_max_body_size 10M;
# Таймауты
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
send_timeout 60s;
# Буферизация
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
proxy_temp_file_write_size 256k;
# Включаем gzip сжатие
gzip on;
gzip_types text/plain application/xml application/json text/css application/javascript;
gzip_min_length 256;
gzip_comp_level 5;
gzip_vary on;
gzip_proxied any;
# Безопасность
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header X-XSS-Protection "1; mode=block";
