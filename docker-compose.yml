networks:
  dev:

volumes:
  backend_data:

services:
  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - dev

  backend:
    build: ./server_python
    ports:
      - '3000:3000'
    volumes:
      - ./server_python:/app
      - ./server/cert:/app/cert
      - backend_data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - SECRET_KEY=your-secret-key-here
      - JWT_EXPIRES_IN=24h
      - DB_FILENAME=/app/data/database.db
    networks:
      - dev

  frontend:
    build: ./webrtc-vue
    ports:
      - '5000:80'
    networks:
      - dev
