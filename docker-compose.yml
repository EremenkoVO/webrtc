networks:
  dev:

services:
  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - dev

  backend:
    build: ./server
    ports:
      - '3000:3000'
    volumes:
      - ./server:/app
    environment:
      - NODE_ENV=development
    command: npm start
    networks:
      - dev

  frontend:
    build: ./webrtc-vue
    ports:
      - '5000:80'
    networks:
      - dev
