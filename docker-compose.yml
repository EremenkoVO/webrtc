version: '3.9'

networks:
  dev:

volumes:
  backend_data:

services:
  nginx:
    image: nginx:latest
    ports:
      - '5001:443' # HTTPS наружу (changed from 5000 due to macOS ControlCenter conflict)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./webrtc-vue/cert:/etc/nginx/cert
    depends_on:
      - backend
      - frontend
    networks:
      - dev

  backend:
    build:
      context: ./goserver
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "8081"
    volumes:
      - backend_data:/app/data
    environment:
      - MYDISCORD_PORT=8080
      - MYDISCORD_DATABASE_DSN=/app/data/database.db
      - MYDISCORD_DATABASE_SALT=${MYDISCORD_DATABASE_SALT:-change-this-salt}
      - MYDISCORD_AUTH_TOKEN_SECRET=${MYDISCORD_AUTH_TOKEN_SECRET:-change-this-secret}
    networks:
      - dev

  frontend:
    build: ./vueclient
    ports:
      - '80'
    networks:
      - dev
