networks:
  prod:

volumes:
  backend_data:
  ssl_certs:

services:
  nginx:
    image: nginx:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - prod

  backend:
    build:
      context: ./server_python
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ssl_certs:/app/cert:ro
      - backend_data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY}
      - JWT_EXPIRES_IN=24h
      - DB_FILENAME=/app/data/database.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prod

  frontend:
    build: ./webrtc-vue
    ports:
      - '5000:80'
    networks:
      - prod
    restart: unless-stopped