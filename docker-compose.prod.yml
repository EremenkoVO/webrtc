networks:
  prod:
    driver: bridge

volumes:
  backend_data:
    driver: local
  ssl_certs:
    driver: local
  certbot_data:
    driver: local

services:
  nginx:
    image: nginx:latest
    container_name: webrtc_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl_certs:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - chatserver
    networks:
      - prod
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: ./goserver
      dockerfile: Dockerfile
    container_name: webrtc_backend
    expose:
      - '8080'
      - '8081'
    volumes:
      - backend_data:/app/data
    environment:
      - MYDISCORD_PORT=8080
      - MYDISCORD_DATABASE_DSN=/app/data/database.db
      - MYDISCORD_DATABASE_SALT=${MYDISCORD_DATABASE_SALT:-change-this-salt}
      - MYDISCORD_AUTH_TOKEN_SECRET=${MYDISCORD_AUTH_TOKEN_SECRET:-change-this-secret}
    restart: unless-stopped
    networks:
      - prod
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  chatserver:
    build:
      context: ./chatserver
      dockerfile: Dockerfile
    container_name: webrtc_chatserver
    expose:
      - '3001'
    environment:
      - PORT=3001
      - MYDISCORD_AUTH_TOKEN_SECRET=${MYDISCORD_AUTH_TOKEN_SECRET:-change-this-secret}
      - BACKEND_API_URL=http://backend:8080
    networks:
      - prod
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: ./vueclient
      dockerfile: Dockerfile
    container_name: webrtc_frontend
    expose:
      - '80'
    networks:
      - prod
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Optional: Certbot for Let's Encrypt SSL certificates
  # Uncomment to use automatic SSL certificate generation
