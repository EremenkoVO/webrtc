[package]
name = "native-audio-capture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "napi7", "napi8", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }

# macOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11"
objc = "0.2"
core-foundation = "0.9"
core-foundation-sys = "0.8"
block = "0.1"
objc_id = "0.1"
screencapturekit = { version = "1", features = ["macos_13_0"] }
coreaudio-sys = "0.2"
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-foundation = "0.3"
objc2 = "0.6"

# Linux dependencies
[target.'cfg(target_os = "linux")'.dependencies]
pulse = "0.3"

[build-dependencies]
napi-build = "2"
